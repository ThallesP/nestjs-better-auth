name: Release NPM Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (npm publish --dry-run, nothing is published)"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # required for npm trusted publishing (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # Do NOT set registry-url here: it writes an .npmrc auth line
          # (_authToken=${NODE_AUTH_TOKEN}) that makes npm use token auth
          # instead of OIDC, and the publish fails with ENEEDAUTH/E404.

      # Trusted publishing requires npm >= 11.5.1; don't rely on the
      # version bundled with the runner's Node.
      - name: Update npm
        run: npm install -g npm@latest && npm --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Check for linting errors
        run: bun run lint

      - name: Check for formatting errors
        run: bun run format

      - name: Run tests
        run: bun run test

      # bun publish doesn't support trusted publishing yet
      # (oven-sh/bun#22423), so the publish step uses npm. No token:
      # npm exchanges the workflow's OIDC token with the registry.
      - name: Release to NPM (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npm publish --dry-run --access public

      - name: Release to NPM
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        run: npm publish --provenance --access public
